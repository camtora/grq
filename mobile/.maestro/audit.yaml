# GRQ Go — visual audit. Taps tabs by their VoiceOver label, so it survives layout changes and runs
# identically on iPhone and iPad. Assumes the sim is already signed in.
#
# NB selectors are REGEX and must match the WHOLE string. RN exposes tab labels only as
# accessibilityText, in the form "Portfolio, tab, 2 of 6" — a bare "Portfolio" matches nothing.
appId: com.camerontora.grqgo
---
- launchApp:
    clearState: false
# The splash gates on a tap anywhere before the tabs mount.
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: ".*Today.*"
    timeout: 20000
- takeScreenshot: /tmp/aud-today

- tapOn: ".*Portfolio, tab.*"
# waitForAnimationToEnd, not an assert on NAV text: the tab-switch transition raced a strict
# extendedWaitUntil on iPad and reported a failure while the tap had actually landed fine. The
# screenshot is the artifact we care about — don't fail a run on a race in the check.
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: /tmp/aud-portfolio

- tapOn: ".*The Wire, tab.*"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: /tmp/aud-wire

- tapOn: ".*Watchlist, tab.*"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: /tmp/aud-watchlist

- tapOn: ".*More, tab.*"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: /tmp/aud-more
